# BSA production overlay — combine with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build
#
# Secrets are provided via a node-local .env (gitignored), consumed here by the
# base file's ${VAR:?...} substitutions. The remote Postgres (gray-db) is reached
# over Tailscale by setting DATABASE_HOST in .env to the tailnet IP/hostname.
services:
  bsa-backend:
    environment:
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}

  bsa-frontend:
    build:
      args:
        # Empty API URLs force the browser to use same-origin /api (proxied by
        # nginx), instead of a hardcoded localhost URL baked into the bundle.
        VITE_API_BASE_URL: ""
        VITE_API_URL: ""