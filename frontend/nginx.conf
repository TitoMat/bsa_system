# Rate-limit zones — declared at http level (this file is included inside http {} by nginx.conf).
limit_req_zone $binary_remote_addr zone=mosv2_api:10m      rate=30r/s;
limit_req_zone $binary_remote_addr zone=mosv2_login:10m    rate=5r/m;
limit_req_zone $binary_remote_addr zone=mosv2_internal:10m rate=5r/s;

server {
  listen 80;
  server_name _;

  # Hide Nginx version from error pages and Server header.
  server_tokens off;

  # Default body-size cap for all API routes.
  # The /api/internal/storage-ingestion/ location overrides this to 600m.
  client_max_body_size 20m;

  # Proxy timeouts — overridden per location where needed.
  proxy_connect_timeout 10s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 ipv6=off valid=30s;

  # Security headers on all responses from this server block.
  add_header X-Frame-Options        "SAMEORIGIN"                      always;
  add_header X-Content-Type-Options "nosniff"                         always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

  # ── Auth ────────────────────────────────────────────────────────────────
  # Tightest rate limit on login to slow brute-force before NestJS
  # LoginRateLimitGuard fires.
  location = /api/auth/login {
    set $backend http://mosv2-backend:8181;
    limit_req zone=mosv2_login burst=5 nodelay;

    proxy_pass         $backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # ── Internal worker ingestion ────────────────────────────────────────────
  # bill-record-archive uploads can reach 512 MB by default; allow headroom.
  # Still rate-limited so unauthenticated callers cannot amplify buffering.
  # NestJS InternalApiKeyGuard rejects requests without a valid key.
  location /api/internal/storage-ingestion/ {
    set $backend http://mosv2-backend:8181;
    limit_req zone=mosv2_internal burst=10 nodelay;

    client_max_body_size 600m;
    proxy_send_timeout   300s;
    proxy_read_timeout   300s;

    proxy_pass         $backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # ── General API ──────────────────────────────────────────────────────────
  location = /api {
    set $backend http://mosv2-backend:8181;
    limit_req zone=mosv2_api burst=50 nodelay;

    proxy_pass         $backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  location /api/ {
    set $backend http://mosv2-backend:8181;
    limit_req zone=mosv2_api burst=50 nodelay;

    proxy_pass         $backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # ── Frontend SPA ─────────────────────────────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }
}
